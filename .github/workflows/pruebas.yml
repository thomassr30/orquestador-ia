name: Pruebas del harness
on:
  push:
  pull_request:
jobs:
  pruebas:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [18, 20, 22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # Pruebas deterministas (unitarias, contrato de adaptadores y corpus de evals/corpus): sin modelos
      - run: npm test
      # El ejemplo de evaluación con modelos solo se valida (nunca se ejecuta en CI: consume tokens)
      - run: node bin/sdd-eval.js evals/ejemplo.tareas.json --validar
